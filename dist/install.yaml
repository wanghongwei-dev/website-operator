apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: websites.web.wanghongwei.dev
spec:
  group: web.wanghongwei.dev
  names:
    kind: WebSite
    listKind: WebSiteList
    plural: websites
    singular: website
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: WebSite is the Schema for the websites API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WebSite
            properties:
              image:
                minLength: 1
                type: string
              replicas:
                default: 1
                format: int32
                maximum: 10
                minimum: 1
                type: integer
            required:
            - image
            type: object
          status:
            description: status defines the observed state of WebSite
            properties:
              readyReplicas:
                format: int32
                type: integer
              url:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
